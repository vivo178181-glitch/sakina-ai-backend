<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAKINA AI</title>
<style>
body{margin:0;font-family:Arial;background:#101827;color:white}
header{padding:20px;background:#18243a;text-align:center;font-size:25px;font-weight:bold}
#chat{padding:15px;height:65vh;overflow-y:auto}
.msg{padding:12px;margin:10px 0;border-radius:12px;white-space:pre-wrap}
.user{background:#254a70;text-align:right}
.ai{background:#263244}
footer{display:flex;gap:8px;padding:12px}
input{flex:1;min-width:0;padding:13px;border-radius:10px;border:0}
button{padding:12px;border:0;border-radius:10px;background:#48a9a6;color:white}
</style>
</head>
<body>
<header>🌸 SAKINA AI</header>
<div id="chat"><div class="msg ai">नमस्ते! मैं SAKINA AI हूँ। ❤️<br>मुझसे कुछ भी पूछो।</div></div>
<footer>
<input id="question" placeholder="यहाँ अपना सवाल लिखो...">
<button onclick="ask()">भेजें</button>
<button onclick="voice()">🎤</button>
</footer>
<script>
const API = "https://sakina-ai-backend-aaqb.onrender.com/chat";
const chat=document.getElementById("chat");
function add(text,cls){
 const d=document.createElement("div");
 d.className="msg "+cls; d.textContent=text;
 chat.appendChild(d); chat.scrollTop=chat.scrollHeight;
 return d;
}
async function ask(){
 const input=document.getElementById("question");
 const q=input.value.trim(); if(!q)return;
 add(q,"user"); input.value="";
 const wait=add("जवाब तैयार हो रहा है...","ai");
 try{
  const r=await fetch(API,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({message:q})
  });
  const data=await r.json();
  if(!r.ok)throw Error(data.error||"सर्वर में समस्या है");
  const answer=data.reply||data.response||data.text;
  if(!answer)throw Error("जवाब नहीं मिला");
  wait.textContent=answer;
  if("speechSynthesis" in window){
   const u=new SpeechSynthesisUtterance(answer);
   u.lang="hi-IN"; speechSynthesis.speak(u);
  }
 }catch(e){
  wait.textContent="अभी जवाब नहीं मिला: "+e.message;
 }
}
document.getElementById("question").addEventListener("keydown",e=>{
 if(e.key==="Enter")ask();
});
function voice(){
 if(!("webkitSpeechRecognition" in window||"SpeechRecognition" in window)){
  alert("इस ब्राउज़र में Voice Input उपलब्ध नहीं है।");return;
 }
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 const rec=new SR();rec.lang="hi-IN";
 rec.onresult=e=>{
  document.getElementById("question").value=e.results[0][0].transcript;
  ask();
 };
 rec.start();
}
</script>
</body>
</html>
